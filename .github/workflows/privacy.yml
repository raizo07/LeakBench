name: privacy

# The gate this repo ships is a self-test: it fails if the demo scenarios stop
# producing the expected reports. In a wallet repo, the same two lines run
# against a report generated from your own transactions.
on:
  push:
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        working-directory: web

      - name: typecheck and build
        run: pnpm build
        working-directory: web

      # Pages serves the committed artifact, so a stale build would ship stale
      # UI. The build is deterministic, which makes this check meaningful.
      - name: web/dist must match the sources
        run: git diff --exit-code -- web/dist/index.html

  leakbench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: unit tests
        run: cargo test --workspace

      - name: generate reports
        run: cargo run -p leakbench-cli -- demo --out reports

      - name: privacy gate — the hardened subject must pass
        run: cargo run -p leakbench-cli -- ci --report reports/hardened.json --fail-on high

      # A gate that has never failed is a gate nobody has tested. This asserts
      # that the fatal subject is actually rejected, so the pass above means
      # something.
      - name: sarif output
        run: |
          cargo run -p leakbench-cli -- sarif --report reports/naive.json --out reports/naive.sarif
          test -s reports/naive.sarif

      # diff must notice the regression, not just print something plausible.
      - name: diff detects the regression
        run: |
          if cargo run -p leakbench-cli -- diff reports/hardened.json reports/naive.json --fail-on-regression; then
            echo "::error::expected the hardened→naive diff to be a regression"
            exit 1
          fi
          echo "regression correctly detected"

      - name: privacy gate — the fatal subject must be rejected
        run: |
          if cargo run -p leakbench-cli -- ci --report reports/naive.json --fail-on high; then
            echo "::error::expected the naive scenario to fail the gate"
            exit 1
          fi
          echo "naive scenario correctly rejected"
