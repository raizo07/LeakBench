s.",fatal:0,file:"hardened.json",findings:5,generated_at:"2026-10-27T00:00:00Z",grade:"B",id:"hardened",kind:"scenario",label:"hardened wallet",score:79,tx_count:13,verdict:"acceptable"}],x1={reports:E1},N1="leakbench.report.v1",O1="2026-10-27T00:00:00Z",A1={name:"leakbench",version:"0.1.0",heuristics:15,fact_sources:["simulated"],network:"main",block_interval_secs:75},j1={label:"naive wallet",kind:"scenario",network:"main",tx_count:7,first_height:3499e3,last_height:3500044,description:"A wallet that moved its whole Orchard balance across the turnstile in one transaction, one block after being paid, then unshielded to an exchange.",has_wallet_facts:!0},C1="disqualified",D1={value:0,grade:"F",verdict:"disqualified",risk_points:273.1,by_severity:{critical:2,high:7,info:0,low:2,medium:12}},M1=JSON.parse(`[{"id":"LB-001","title":"Turnstile amount disclosure","severity":"critical","confidence":"high","category":"leak","fatal":true,"summary":"This transaction moved 5 ZEC from the Orchard pool to the Ironwood pool. Each pool's value balance is a consensus-encoded public field, so the amount is visible to anyone with a block explorer. The amount is a Whole-ZEC amount, which is rare in real migration traffic. That makes the crossing identifiable by amount alone, without breaking any cryptography.","evidence":[{"label":"crossing","value":"orchard -> ironwood"},{"label":"amount revealed","value":"5 ZEC"},{"label":"orchard value balance","value":"5 ZEC","detail":"positive = value leaving the pool; public consensus field"},{"label":"ironwood value balance","value":"-5 ZEC","detail":"negative = value entering the pool; public consensus field"},{"label":"same-size-band crossings","value":"0 other(s) within ±25%"},{"label":"wallet total in source pool","value":"5 ZEC"},{"label":"height","value":"3,500,041"},{"label":"txid","value":"30cc9acb8b1b2c500ef5754112486810bc7e74bb7e94d2bd6b64019bb22d1d59"}],"remediation":"Do not cross pools with an amount you would not publish. Split the migration into several crossings of non-round amounts, separated in time, and draw each chunk from a distribution that overlaps other users' behaviour. A crossing that is exactly your balance is the worst case: it publishes your total holdings.","txids":["30cc9acb8b1b2c500ef5754112486810bc7e74bb7e94d2bd6b64019bb22d1d59"],"references":["https://zips.z.cash/zip-0258","https://zips.z.cash/protocol/protocol.pdf"]},{"id":"LB-003","title":"Transparent leg (unshielding)","severity":"critical","confidence":"high","category":"leak","fatal":true,"summary":"Shielded funds were paid out to 1 transparent output(s). The transparent pool is public: the amount, the addresses and the timing are all visible, which breaks the shielded set for this payment.","evidence":[{"label":"amount exposed","value":"1 ZEC"},{"label":"transparent outputs","value":"1"},{"label":"height","value":"3,500,043"},{"label":"txid","value":"e0a5af7f3a2c76d0c78b0362a8dcce30cb2ce07f67bb1c794aefbddbdd94f8e5"}],"remediation":"Pay shielded recipients shielded. If an exchange forces a transparent deposit address, treat that amount as public and keep it separate from the rest of your balance.","txids":["e0a5af7f3a2c76d0c78b0362a8dcce30cb2ce07f67bb1c794aefbddbdd94f8e5"],"references":["https://zips.z.cash/zip-0320"]},{"id":"LB-006","title":"Anchor staleness","severity":"high","confidence":"medium","category":"fingerprint","fatal":false,"summary":"This spend commits to an anchor 130 blocks behind the chain tip (130 blocks / 2h 42m). The lag is a behavioural fingerprint: wallets with the same sync cadence produce the same lag, and an unusually stale anchor is rare.","evidence":[{"label":"anchor age","value":"130 blocks"},{"label":"wall-clock lag","value":"130 blocks / 2h 42m"},{"label":"txid","value":"30cc9acb8b1b2c500ef5754112486810bc7e74bb7e94d2bd6b64019bb22d1d59"}],"remediation":"Sync to the tip immediately before spending so the anchor is fresh, and avoid long gaps between sync and spend that make your anchor older than everyone else's.","txids":["30cc9acb8b1b2c500ef5754112486810bc7e74bb7e94d2bd6b64019bb22d1d59"],"references":["https://zips.z.cash/protocol/protocol.pdf"]},{"id":"LB-008","title":"Transparent address reuse","severity":"high","confidence":"high","category":"linkage","fatal":false,"summary":"Transparent address t1UnExChange…ddr9kQ was used 2 times. Every transaction touching it is linked, and the linkage survives any amount of shielding later.","evidence":[{"label":"address","value":"t1UnExChangeDepositAddr9kQ"},{"label":"uses","value":"2"},{"label":"linked transactions","value":"e0a5af7f3a2c76d0c78b0362a8dcce30cb2ce07f67bb1c794aefbddbdd94f8e5, 7aa7f742f8609012ddcbcfd34eeed319f7eaa3da44f305ef4c95d16659357463"}],"remediation":"Use a fresh transparent address per transaction, or stay in a shielded pool. Treat a transparent address as a permanent public identifier for its owner.","txids":["e0a5af7f3a2c76d0c78b0362a8dcce30cb2ce07f67bb1c794aefbddbdd94f8e5","7aa7f742f8609012ddcbcfd34eeed319f7eaa3da44f305ef4c95d16659357463"],"references":["https://zips.z.cash/zip-0316"]},{"id":"LB-013","title":"Unique note value","severity":"high","confidence":"medium","category":"linkage","fatal":false,"summary":"A note of 15 ZEC is held by 0 of the 3 observed notes from other wallets. When a value is unique, an observer can follow the amount rather than the address.","evidence":[{"label":"note value","value":"15 ZEC"},{"label":"peer notes with same value","value":"0"},{"label":"peer sample","value":"3"},{"label":"txid","value":"38c835d7f51a1f10596e0e0a75a431ced083ff80b467bdd4d02646f47e46f2c4"}],"remediation":"Break unique denominations: split incoming funds into a small set of common denominations, or receive into a fresh account whose value histogram resembles everyone else's.","txids":["38c835d7f51a1f10596e0e0a75a431ced083ff80b467bdd4d02646f47e46f2c4"]},{"id":"LB-013","title":"Unique note value","severity":"high","confidence":"medium","category":"linkage","fatal":false,"summary":"A note of 0.2 ZEC is held by 0 of the 3 observed notes from other wallets. When a value is unique, an observer can follow the amount rather than the address.","evidence":[{"label":"note value","value":"0.2 ZEC"},{"label":"peer notes with same value","value":"0"},{"label":"peer sample","value":"3"},{"label":"txid","value":"3e9470b3dff08648f6918f3636fbea8158e804e941984df392bdda79aa464f97"}],"remediation":"Break unique denominations: split incoming funds into a small set of common denominations, or receive into a fresh account whose value histogram resembles everyone else's.","txids":["3e9470b3dff08648f6918f3636fbea8158e804e941984df392bdda79aa464f97"]},{"id":"LB-013","title":"Unique note value","severity":"high","confidence":"medium","category":"linkage","fatal":false,"summary":"A note of 3.4 ZEC is held by 0 of the 3 observed notes from other wallets. When a value is unique, an observer can follow the amount rather than the address.","evidence":[{"label":"note value","value":"3.4 ZEC"},{"label":"peer notes with same value","value":"0"},{"label":"peer sample","value":"3"},{"label":"txid","value":"618d5de7d7c99dd07b2e54300f8353b19fc713cf502fb69379b5db3003dc97b7"}],"remediation":"Break unique denominations: split incoming funds into a small set of common denominations, or receive into a fresh account whose value histogram resembles everyone else's.","txids":["618d5de7d7c99dd07b2e54300f8353b19fc713cf502fb69379b5db3003dc97b7"]},{"id":"LB-013","title":"Unique note value","severity":"high","confidence":"medium","category":"linkage","fatal":false,"summary":"A note of 1.6 ZEC is held by 0 of the 3 observed notes from other wallets. When a value is unique, an observer can follow the amount rather than the address.","evidence":[{"label":"note value","value":"1.6 ZEC"},{"label":"peer notes with same value","value":"0"},{"label":"peer sample","value":"3"},{"label":"txid","value":"84f2cb019a8398269fa30e17f0f3bbca60290ec02cbe1dd76844cdacbff2792b"}],"remediation":"Break unique denominations: split incoming funds into a small set of common denominations, or receive into a fresh account whose value histogram resembles everyone else's.","txids":["84f2cb019a8398269fa30e17f0f3bbca60290ec02cbe1dd76844cdacbff2792b"]},{"id":"LB-015","title":"Full-balance migration","severity":"high","confidence":"medium","category":"leak","fatal":false,"summary":"The crossing equals this wallet's entire Orchard holding (5 ZEC across 2 notes). Amount disclosure is one problem; disclosing that the amount is your whole balance is a second, worse one.","evidence":[{"label":"crossed","value":"5 ZEC"},{"label":"wallet total in pool","value":"5 ZEC"},{"label":"notes consumed","value":"2"},{"label":"txid","value":"30cc9acb8b1b2c500ef5754112486810bc7e74bb7e94d2bd6b64019bb22d1d59"}],"remediation":"Migrate in chunks that are individually unremarkable, and leave a remainder behind initially. A full-balance crossing links the new account to the entire history of the old one.","txids":["30cc9acb8b1b2c500ef5754112486810bc7e74bb7e94d2bd6b64019bb22d1d59"],"references":["https://zips.z.cash/zip-0258"]},{"id":"LB-002","title":"Turnstile timing anonymity set","severity":"medium","confidence":"high","category":"linkage","fatal":false,"summary":"A pool crossing is anonymous only if it hides among other crossings. In the 20 blocks (+/- 25 minutes) around this one, 3 other crossings in the window.","evidence":[{"label":"window","value":"20 blocks / 1500s"},{"label":"anonymity set","value":"3 other crossings in the window"},{"label":"crossing","value":"orchard -> ironwood"},{"label":"height","value":"3,500,041"},{"label":"txid","value":"30cc9acb8b1b2c500ef5754112486810bc7e74bb7e94d2bd6b64019bb22d1d59"}],"remediation":"Schedule crossings with randomized delay measured in hours, not blocks, and avoid known migration waves (network-upgrade days, exchange announcements) where your crossing is one of very few.","txids":["30cc9acb8b1b2c500ef5754112486810bc7e74bb7e94d2bd6b64019bb22d1d59"],"references":["
